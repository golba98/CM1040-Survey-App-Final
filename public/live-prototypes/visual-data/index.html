<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark light">
    <meta name="description" content="Visual data telemetry prototype for South Africa's internet history, 2006 to 2012.">
    <title>Dataset 01 · 2006–2012 | Empirical Telecom Portal</title>
    <script>
      (function() {
        const stored = localStorage.getItem("theme");
        if (stored === "dark" || stored === "light") {
          document.documentElement.setAttribute("data-theme", stored);
        } else if (window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches) {
          document.documentElement.setAttribute("data-theme", "light");
        } else {
          document.documentElement.setAttribute("data-theme", "dark");
        }
      })();
    </script>
    <script type="module" crossorigin src="./assets/main-Bql7TXHL.js"></script>

  </body>
</html>
