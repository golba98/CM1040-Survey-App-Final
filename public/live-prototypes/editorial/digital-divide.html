  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark light">
    <meta name="description" content="Editorial prototype for South Africa's modern internet landscape and digital divide, 2020 to 2026.">
    <title>2020–2026 | Editorial Story Demo</title>
    <script>
      (function() {
        // Dark by default; the participant's own choice, once made, wins.
        // The prototype's runtime re-resolves the theme from localStorage after
        // load, so seed the stored value rather than only setting the attribute.
        let stored = localStorage.getItem("theme");
        if (stored !== "dark" && stored !== "light") {
          stored = "dark";
          try { localStorage.setItem("theme", stored); } catch (e) {}
        }
        document.documentElement.setAttribute("data-theme", stored);
      })();
    </script>

  </body>
