<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/connected-sa-mark.svg?v=2" />
    <meta
      name="description"
      content="Review three website designs for a site about internet access in South Africa and tell me which one works best. Anonymous, about 10–15 minutes, works on your phone."
    />
    <meta name="theme-color" content="#0a0a0a" />
    <title>Help shape the final website | CM1040 design review</title>

    <!-- Link preview. Chat apps read these when the URL is pasted; the image
         must be an absolute URL and a raster format, so it is rendered to PNG
         from scripts/link-preview.html by `npm run capture:preview`. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Connected South Africa · CM1040" />
    <meta property="og:url" content="https://cm1040survey.online/" />
    <meta property="og:title" content="Help shape the final website" />
    <meta
      property="og:description"
      content="Three designs for the same site. Tell me which one works best — anonymous, about 10–15 minutes, works on your phone."
    />
    <meta
      property="og:image"
      content="https://cm1040survey.online/link-preview.png?v=1"
    />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Help shape the final website — the three designs under review: Timeline History, Editorial Story and Visual Data."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Help shape the final website" />
    <meta
      name="twitter:description"
      content="Three designs for the same site. Tell me which one works best — anonymous, about 10–15 minutes, works on your phone."
    />
    <meta
      name="twitter:image"
      content="https://cm1040survey.online/link-preview.png?v=1"
    />
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
